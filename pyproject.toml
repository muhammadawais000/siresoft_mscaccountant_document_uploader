[project]
name = "msc-document-intake"
version = "0.1.0"
description = "Reusable Django module for accounting document intake and local-model extraction."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.1,<6.0",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "Pillow>=10.4",
    "python-magic>=0.4.27",
    "jsonschema>=4.23",
    "python-json-logger>=2.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "types-jsonschema",
    "pre-commit>=3.8",
    "reportlab>=4.2",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/*"]
force-exclude = true  # honour excludes even when pre-commit passes filenames

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "DJ", "SIM", "RUF", "N", "C4", "PT", "RET"]
ignore = [
    "RUF012",  # mutable class attrs are idiomatic in Django/DRF
    "N818",  # domain exception names (UploadRejected) read better without an Error suffix
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "SIM300"]
"config/settings/*" = ["F405", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["config", "document_intake"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["document_intake.tests.*", "document_intake.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Celery ships no type hints, so @shared_task is an untyped decorator.
module = ["document_intake.tasks"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = ["e2e: end-to-end pipeline tests (provider mocked)"]

[tool.coverage.run]
source = ["document_intake"]
omit = ["*/migrations/*", "*/tests/*"]
