{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Document intake</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f2a44'/%3E%3Crect x='4' y='3' width='8' height='10' rx='1' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'document_intake/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'document_intake/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'document_intake/css/components.css' %}">
</head>
<body>
  <main class="auth">
    <div class="auth__panel">
      <div class="auth__brand">
        <span class="auth__mark" aria-hidden="true">MSC</span>
        <h1>Sign in</h1>
      </div>
      <form class="panel panel__body stack" method="post" novalidate>
        {% csrf_token %}
        {% if form.errors %}
        <div class="notice notice--err" role="alert">The username or password is not correct.</div>
        {% endif %}
        <div class="field">
          <label class="field__label" for="id_username">Username</label>
          <input class="input" id="id_username" name="username" autocomplete="username" required autofocus
                 value="{{ form.username.value|default:'' }}">
        </div>
        <div class="field">
          <label class="field__label" for="id_password">Password</label>
          <input class="input" id="id_password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn--primary" type="submit">Sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
