# Local stack: postgres, redis, web, worker.
# Ollama is NOT part of this stack. It runs on the host or a separate server,
# reached through OLLAMA_BASE_URL.
name: msc-intake

x-app: &app
  build:
    context: .
    args:
      INSTALL_DEV: "true"
  env_file: .env
  environment:
    DATABASE_URL: postgres://intake:intake@db:5432/intake
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    INTAKE_PRIVATE_STORAGE_ROOT: /app/private_media
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - private_media:/app/private_media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: intake
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: intake
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=INFO --concurrency=1

volumes:
  pgdata:
  private_media:
