{% for row in rows %}
<li class="activity__item">
  <span class="activity__when">{{ row.when|date:"M j, Y, H:i" }}</span>
  <span class="activity__what">{{ row.who }}</span>
  <span class="activity__detail">{{ row.what }}</span>
</li>
{% empty %}
<li class="empty">No activity yet.</li>
{% endfor %}
