{# One line per uploaded file. The table reloads itself (HX-Trigger: documents-changed). #}
{% for item in results %}
<li class="queue__item">
  <span class="queue__name">{{ item.name }}</span>
  <span class="{% if item.ok %}queue__message--ok{% else %}queue__message--error{% endif %}">{{ item.text }}</span>
</li>
{% endfor %}
