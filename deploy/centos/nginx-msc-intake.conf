# /etc/nginx/conf.d/msc-intake.conf
# TLS: run `certbot --nginx -d intake.example.com` after this works on port 80.
server {
    listen 80;
    server_name intake.example.com;

    # Uploads are capped at 25 MB in Django; reject bigger bodies here first.
    client_max_body_size 26m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static files are served by the app (WhiteNoise). The private document storage
    # is never exposed: documents only leave through the permission-checked views.
}
